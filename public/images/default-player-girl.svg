<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="girlBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050914"/>
    </linearGradient>
    <linearGradient id="girlBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="girlSilhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <clipPath id="girlCircleClip">
      <circle cx="60" cy="60" r="54"/>
    </clipPath>
  </defs>

  <!-- Base Circle Background -->
  <circle cx="60" cy="60" r="54" fill="url(#girlBgGrad)" />

  <!-- Clipped Silhouette -->
  <g clip-path="url(#girlCircleClip)">
    <!-- Ponytail / High Bun in Background -->
    <path d="M72 32 C84 26, 92 38, 88 52 C84 62, 74 60, 72 50 Z" fill="#64748b" opacity="0.95" />
    <path d="M70 34 C76 30, 82 36, 78 44 Z" fill="#475569" opacity="0.6"/>

    <!-- Shoulders & Athletic V-Neck Jersey -->
    <path d="M22 116 C24 92, 40 82, 49 78 L53 84 L60 90 L67 84 L71 78 C80 82, 96 92, 98 116 Z" fill="url(#girlSilhouetteGrad)" />
    <!-- Jersey detail -->
    <path d="M49 78 L56 95 L60 92 L64 95 L71 78" fill="#0b1329" opacity="0.35"/>
    <path d="M53 84 L60 102 L67 84" fill="#0b1329" opacity="0.25"/>

    <!-- Slender Neck -->
    <path d="M51 66 C51 76, 69 76, 69 66 L69 54 L51 54 Z" fill="url(#girlSilhouetteGrad)" />

    <!-- Head & Ears -->
    <!-- Ears -->
    <ellipse cx="46" cy="48" rx="3.5" ry="6" fill="url(#girlSilhouetteGrad)"/>
    <ellipse cx="74" cy="48" rx="3.5" ry="6" fill="url(#girlSilhouetteGrad)"/>
    <!-- Face / Soft Feminine Jawline -->
    <path d="M47 40 C47 25, 73 25, 73 40 C73 53, 67 62, 60 62 C53 62, 47 53, 47 40 Z" fill="url(#girlSilhouetteGrad)" />
    
    <!-- Female Hair swept back / headband style -->
    <path d="M45 39 C45 22, 51 14, 60 14 C69 14, 75 22, 75 39 C72 32, 66 30, 60 30 C53 30, 48 33, 45 39 Z" fill="#64748b" />
    <!-- Side hair strands -->
    <path d="M46 38 C44 48, 47 56, 49 58 C47 52, 46 45, 48 40 Z" fill="#475569"/>
    <path d="M74 38 C76 48, 73 56, 71 58 C73 52, 74 45, 72 40 Z" fill="#475569"/>
  </g>

  <!-- Vibrant Cyan/Magenta Border Ring -->
  <circle cx="60" cy="60" r="55" fill="none" stroke="url(#girlBorderGrad)" stroke-width="4.5" />
</svg>
