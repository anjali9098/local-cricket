<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="boyBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050914"/>
    </linearGradient>
    <linearGradient id="boyBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="boySilhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <clipPath id="boyCircleClip">
      <circle cx="60" cy="60" r="54"/>
    </clipPath>
  </defs>

  <!-- Base Circle Background -->
  <circle cx="60" cy="60" r="54" fill="url(#boyBgGrad)" />

  <!-- Clipped Silhouette -->
  <g clip-path="url(#boyCircleClip)">
    <!-- Shoulders & Collared Shirt -->
    <path d="M18 116 C20 90, 38 80, 48 76 L52 82 L60 88 L68 82 L72 76 C82 80, 100 90, 102 116 Z" fill="url(#boySilhouetteGrad)" />
    <!-- Collar Line details -->
    <path d="M48 76 L56 94 L60 92 L64 94 L72 76" fill="#0b1329" opacity="0.35"/>
    <path d="M52 82 L60 102 L68 82" fill="#0b1329" opacity="0.25"/>

    <!-- Neck -->
    <path d="M49 66 C49 76, 71 76, 71 66 L71 54 L49 54 Z" fill="url(#boySilhouetteGrad)" />

    <!-- Head & Ears -->
    <!-- Ears -->
    <ellipse cx="44" cy="46" rx="4" ry="7" fill="url(#boySilhouetteGrad)"/>
    <ellipse cx="76" cy="46" rx="4" ry="7" fill="url(#boySilhouetteGrad)"/>
    <!-- Face / Jawline -->
    <path d="M46 38 C46 22, 74 22, 74 38 C74 52, 68 62, 60 62 C52 62, 46 52, 46 38 Z" fill="url(#boySilhouetteGrad)" />
    <!-- Modern Stylish Hair -->
    <path d="M43 38 C43 23, 49 14, 60 14 C71 14, 77 22, 77 34 C74 30, 68 28, 59 30 C51 32, 46 35, 43 38 Z" fill="#718096" opacity="0.9" />
  </g>

  <!-- Vibrant Cyan/Blue Border Ring -->
  <circle cx="60" cy="60" r="55" fill="none" stroke="url(#boyBorderGrad)" stroke-width="4.5" />
</svg>
