<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="boyBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="boyBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="boySilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <clipPath id="boyCircleClip">
      <circle cx="60" cy="60" r="54"/>
    </clipPath>
  </defs>

  <!-- Base Circle Background -->
  <circle cx="60" cy="60" r="54" fill="url(#boyBgGrad)"/>

  <!-- Clipped Clean Minimalist Silhouette -->
  <g clip-path="url(#boyCircleClip)">
    <!-- Head -->
    <ellipse cx="60" cy="42" rx="17" ry="21" fill="url(#boySilGrad)"/>
    <!-- Neck -->
    <path d="M51 58 L51 68 L69 68 L69 58 Z" fill="url(#boySilGrad)"/>
    <!-- Shoulders & Athletic Torso -->
    <path d="M22 110 C24 88, 38 74, 52 70 L60 76 L68 70 C82 74, 96 88, 98 110 Z" fill="url(#boySilGrad)"/>
  </g>

  <!-- Vibrant Cyan/Blue Border Ring -->
  <circle cx="60" cy="60" r="55" fill="none" stroke="url(#boyBorderGrad)" stroke-width="4.5"/>
</svg>
