<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="girlBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="girlBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="girlSilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <clipPath id="girlCircleClip">
      <circle cx="60" cy="60" r="54"/>
    </clipPath>
  </defs>

  <!-- Base Circle Background -->
  <circle cx="60" cy="60" r="54" fill="url(#girlBgGrad)"/>

  <!-- Clipped Clean Minimalist Silhouette -->
  <g clip-path="url(#girlCircleClip)">
    <!-- Ponytail Contour -->
    <path d="M72 34 C82 28, 90 38, 86 50 C82 58, 74 56, 70 48 Z" fill="url(#girlSilGrad)" opacity="0.95"/>
    <!-- Head -->
    <ellipse cx="60" cy="42" rx="16" ry="20" fill="url(#girlSilGrad)"/>
    <!-- Neck -->
    <path d="M52 58 L52 68 L68 68 L68 58 Z" fill="url(#girlSilGrad)"/>
    <!-- Shoulders & Torso -->
    <path d="M24 110 C26 90, 40 76, 52 71 L60 77 L68 71 C80 76, 94 90, 96 110 Z" fill="url(#girlSilGrad)"/>
  </g>

  <!-- Vibrant Cyan/Pink Border Ring -->
  <circle cx="60" cy="60" r="55" fill="none" stroke="url(#girlBorderGrad)" stroke-width="4.5"/>
</svg>
